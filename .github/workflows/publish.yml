name: Build and publish BlueOS extension

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Where to publish (ghcr uses your GitHub account)
        type: choice
        default: ghcr
        options: [ghcr, dockerhub]

permissions:
  contents: read

jobs:
  test-pi-images:
    name: Test Pi image (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/arm/v7, linux/arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check Cockpit widget behavior
        run: node --test tests/widget.test.cjs
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build architecture test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: atlas-pi-test:local
      - name: Run tests and onboard startup check under ARM emulation
        env:
          ATLAS_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$ATLAS_PLATFORM" -v "$PWD/tests:/tests:ro" -v "$PWD/scripts:/app/scripts:ro" atlas-pi-test:local python -m unittest discover -s /tests -v
          docker run -d --name atlas-smoke --platform "$ATLAS_PLATFORM" atlas-pi-test:local
          trap 'docker logs atlas-smoke; docker rm -f atlas-smoke' EXIT
          docker exec -i atlas-smoke python - < scripts/smoke_image.py

  publish:
    name: Publish multi-architecture extension
    needs: test-pi-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Prepare version and BlueOS metadata
        id: meta
        env:
          REGISTRY: ${{ inputs.registry }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          MY_NAME: ${{ vars.MY_NAME }}
          MY_EMAIL: ${{ vars.MY_EMAIL }}
        run: python3 scripts/prepare_release.py
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to GitHub Container Registry
        if: inputs.registry != 'dockerhub'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign in to Docker Hub
        if: inputs.registry == 'dockerhub'
        uses: docker/login-action@v4
        with:
          username: ${{ steps.meta.outputs.username }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push both Pi architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm/v7,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            AUTHORS=${{ steps.meta.outputs.authors }}
            COMPANY=${{ steps.meta.outputs.company }}
            README_URL=${{ steps.meta.outputs.readme }}
            LINKS=${{ steps.meta.outputs.links }}
            SOURCE_URL=${{ steps.meta.outputs.source }}
      - name: Verify published manifest includes both Pi architectures
        env:
          ATLAS_IMAGE: ${{ steps.meta.outputs.image }}
          ATLAS_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$ATLAS_IMAGE:$ATLAS_VERSION" --raw > manifest.json
          python3 scripts/check_manifest.py manifest.json
      - name: Provide BlueOS install fields (and Docker Hub Bazaar metadata)
        uses: actions/upload-artifact@v6
        with:
          name: blueos-install-and-bazaar
          path: release/
